name: 'CI-tron GitHub Action'
description: 'CI-tron integration for bare-metal testing on GitHub Actions'
author: 'CI-tron development team'
branding:
  icon: 'cpu'
  color: 'orange'

runs:
  using: 'composite'
  steps:
    - name: Action usage guide
      shell: bash
      run: |
        cat << 'EOF'
        ╔════════════════════════════════════════════════════════════════╗
        ║           CI-tron GitHub Action - Usage Guide                  ║
        ╚════════════════════════════════════════════════════════════════╝

        This action has multiple modes. Please use one of the sub-actions:

        🔧 Low-Level (For kernel/bootloader testing):
           - uses: gfx-ci/ci-tron-action/ci-tron-job@v1
             env:
               CI_TRON_JOB_TEMPLATE_PROJECT_URL: https://gitlab.freedesktop.org/gfx-ci/ci-tron
               CI_TRON_JOB_TEMPLATE_COMMIT: main
               CI_TRON_PATTERN__SESSION_END__REGEX: "^.*shutdown\\r?$"
               CI_TRON_PATTERN__JOB_SUCCESS__REGEX: "^.*passed\\r?$"
               CI_TRON_KERNEL__URL: 'https://example.com/kernel'

        📦 Boot2Container (Recommended for most use cases):
           - uses: gfx-ci/ci-tron-action/ci-tron-b2c-job@v1
             env:
               CI_TRON_JOB_TEMPLATE_PROJECT_URL: https://gitlab.freedesktop.org/gfx-ci/ci-tron
               CI_TRON_JOB_TEMPLATE_COMMIT: main
               CI_TRON_KERNEL__URL: 'https://gitlab.freedesktop.org/gfx-ci/boot2container/-/releases/v0.9.17/downloads/linux-x86_64'
               CI_TRON_INITRAMFS__B2C__URL: 'https://gitlab.freedesktop.org/gfx-ci/boot2container/-/releases/v0.9.17/downloads/initramfs.linux_amd64.cpio.xz'
             with:
               image: 'alpine:latest'
               command: './test.sh'

        💿 Diskless (For systems without local storage):
           - uses: gfx-ci/ci-tron-action/ci-tron-b2c-diskless-job@v1
             env:
               CI_TRON_JOB_TEMPLATE_PROJECT_URL: https://gitlab.freedesktop.org/gfx-ci/ci-tron
               CI_TRON_JOB_TEMPLATE_COMMIT: main
               CI_TRON__B2C_DISKLESS_IMAGESTORE_PLATFORM: 'linux/amd64'
               CI_TRON_KERNEL__URL: 'https://gitlab.freedesktop.org/gfx-ci/boot2container/-/releases/v0.9.17/downloads/linux-x86_64'
               CI_TRON_INITRAMFS__B2C__URL: 'https://gitlab.freedesktop.org/gfx-ci/boot2container/-/releases/v0.9.17/downloads/initramfs.linux_amd64.cpio.xz'
             with:
               image: 'ubuntu:22.04'
               command: './test.sh'

        📖 Documentation: https://github.com/gfx-ci/ci-tron-action

        For more examples and configuration options, see the README.md

        EOF
        exit 1
